<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f0d060"/>
    </linearGradient>
  </defs>
  <!-- Brown circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Gold ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- Arabic letter ض -->
  <text x="32" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="url(#gold)">ض</text>
</svg>
